<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No third-party code, ever: scripts and styles may only come from this
     origin, and the only host the page may talk to is GitHub's gist API.
     That is what keeps the sync token out of anyone else's reach. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com https://gist.githubusercontent.com; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>המחברת - a Hebrew course</title>
<meta name="description" content="A Hebrew course from the alef-bet to B2: reading with and without nikud, grammar, vocabulary and spaced-repetition flashcards.">
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0038b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="המחברת">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23fff'/><rect y='3' width='32' height='5' fill='%230038b8'/><rect y='24' width='32' height='5' fill='%230038b8'/><g fill='none' stroke='%230038b8' stroke-width='1.1'><polygon points='16,10 10.8,19 21.2,19'/><polygon points='16,22 21.2,13 10.8,13'/></g></svg>">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text" lang="he" dir="rtl">המחברת<small>עברית</small></span>
  </a>
  <div class="topbar-search">
    <input type="search" id="globalSearch" placeholder="Search lessons and vocabulary…" dir="auto" autocomplete="off" spellcheck="false" aria-label="Search">
    <kbd>/</kbd>
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <div class="quickadd" id="quickAdd">
    <button class="iconbtn" id="addWordBtn" aria-label="Add a word to your vocabulary" aria-expanded="false" title="Add a word (n)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </button>
    <div class="quickadd-menu" id="addWordMenu" hidden></div>
  </div>
  <div class="audio-control">
    <button class="iconbtn" id="audioBtn" aria-label="Audio settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/>
        <path d="M15.6 9a4 4 0 0 1 0 6M18.3 6.5a7.6 7.6 0 0 1 0 11"/>
      </svg>
    </button>
    <div class="audio-menu" id="audioMenu" hidden></div>
  </div>
  <a class="offline-pill" id="offlinePill" href="#/dashboard" hidden
     title="Offline status - tap for details"></a>
  <button class="iconbtn" id="nikudBtn" aria-label="Show or hide vowel points"
          aria-pressed="true" title="Vowel points (nikud)">
    <span class="nikud-glyph" aria-hidden="true" lang="he">אָ</span>
  </button>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Course contents">
    <div class="progress-card">
      <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="ring-bg" cx="22" cy="22" r="19"/>
        <circle class="ring-fg" id="progressRing" cx="22" cy="22" r="19"/>
      </svg>
      <div class="progress-meta">
        <strong id="progressPct">0%</strong>
        <span id="progressText">nothing read yet</span>
      </div>
    </div>
    <div id="nav"></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main id="main" tabindex="-1">
    <article id="view" class="prose"></article>
    <nav class="pager" id="pager" aria-label="Lesson navigation"></nav>
  </main>
</div>

<script src="assets/boot.js"></script>
<script src="assets/data.js"></script>
<script src="assets/hebrew.js"></script>
<script src="assets/md.js"></script>
<script src="assets/progress.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/audio.js"></script>
<script src="assets/speech.js"></script>
<script src="assets/test.js"></script>
<script src="assets/read.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/vocab.js"></script>
<script src="assets/select.js"></script>
<script src="assets/app.js"></script>
<script src="assets/offline.js"></script>
</body>
</html>
